name: Build TDLib for OHOS aarch64

on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/tdlib-ohos.yml' ]

env:
  SDK_URL: https://repo.huaweicloud.com/openharmony/os/5.0.2-Release/ohos-sdk-windows_linux-public.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gperf cmake ninja-build

      - name: Download OHOS SDK (2.6GB, ~3min)
        run: |
          wget -q --tries=3 "$SDK_URL" -O /tmp/sdk.tar.gz
          ls -la /tmp/sdk.tar.gz

      - name: Extract native toolchain
        run: |
          mkdir -p /opt/sdk && tar xzf /tmp/sdk.tar.gz -C /opt/sdk
          LINUX_ZIP=$(find /opt/sdk -name "*native*linux*.zip" -o -name "*linux*native*.zip" | head -1)
          echo "native zip: $LINUX_ZIP"
          unzip -q "$LINUX_ZIP" -d /opt/nat
          echo "--- 解压布局 ---"
          find /opt/nat -maxdepth 3 -type d | head -20
          # 用 llvm 目录反推 native 根目录（llvm 必存在）
          LLVM_DIR=$(find /opt/nat -maxdepth 4 -type d -name llvm | head -1)
          [ -z "$LLVM_DIR" ] && { echo "FATAL: llvm dir not found"; find /opt/nat -maxdepth 4 | head -40; exit 1; }
          NATIVE=$(dirname "$LLVM_DIR")
          echo "NATIVE=$NATIVE" >> $GITHUB_ENV
          echo "NATIVE=$NATIVE"
          test -x "$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" || { echo "FATAL: clang missing"; exit 1; }
          test -f "$NATIVE/build/cmake/ohos.toolchain.cmake" && echo "toolchain cmake OK"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: opt-deps
          key: ohos-deps-v2

      - name: Build OpenSSL 1.1.1w
        run: |
          if [ -f opt-deps/ssl/lib/libssl.a ]; then echo cached; exit 0; fi
          export PATH=$NATIVE/llvm/bin:$PATH
          CC=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang
          wget -q https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz && cd openssl-1.1.1w
          CC=$CC ./Configure linux-aarch64 shared no-asm no-tests \
            --prefix=$GITHUB_WORKSPACE/opt-deps/ssl -fPIC
          make -j$(nproc)
          make install_sw

      - name: Build zlib 1.3.1
        run: |
          if [ -f opt-deps/zlib/lib/libz.a ]; then echo cached; exit 0; fi
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf zlib-1.3.1.tar.gz && cd zlib-1.3.1
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NATIVE/build/cmake/ohos.toolchain.cmake \
            -DOHOS_ARCH=arm64-v8a \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/opt-deps/zlib \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build && cmake --install build

      - name: Pre-generate TDLib sources (host)
        run: |
          # TDLib 官方两阶段构建：host 上跑 prepare_cross_compiling 生成全部 auto 文件
          # (mime 表 + tl schema c++ + json 接口等)
          git clone --depth 1 --branch v1.8.0 https://github.com/tdlib/td.git
          cmake -B td-host-build -S td -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build td-host-build --target prepare_cross_compiling -j$(nproc)
          # prepare 会生成 auto 文件并自动移除自身工具，检查产物
          ls td/td/generate/auto/ | head -5
          ls td/tdutils/generate/auto/ | head -5
          rm -rf td-host-build

      - name: Build TDLib tdjson
        run: |
          # td 已在预生成步骤 clone，直接用
          # ohos.toolchain.cmake 把 find_package 锁在 sysroot，需扩展 root path 并显式给 OpenSSL 路径
          cmake -B build -G Ninja -S td \
            -DCMAKE_TOOLCHAIN_FILE=$NATIVE/build/cmake/ohos.toolchain.cmake \
            -DOHOS_ARCH=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="/opt/nat/native/sysroot;$GITHUB_WORKSPACE/opt-deps/ssl;$GITHUB_WORKSPACE/opt-deps/zlib" \
            -DOPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/opt-deps/ssl \
            -DOPENSSL_INCLUDE_DIR=$GITHUB_WORKSPACE/opt-deps/ssl/include \
            -DOPENSSL_CRYPTO_LIBRARY=$GITHUB_WORKSPACE/opt-deps/ssl/lib/libcrypto.so \
            -DOPENSSL_SSL_LIBRARY=$GITHUB_WORKSPACE/opt-deps/ssl/lib/libssl.so \
            -DZLIB_INCLUDE_DIR=$NATIVE/sysroot/usr/include \
            -DZLIB_LIBRARY=$NATIVE/sysroot/usr/lib/aarch64-linux-ohos/libz.so \
            -DTD_ENABLE_JNI=OFF -DTD_ENABLE_DOTNET=OFF
          cmake --build build --target tdjson -j$(nproc)

      - name: Package
        run: |
          mkdir -p stage
          find build -name "libtdjson.so" -exec cp {} stage/ \;
          cp td/td/telegram/td_json_client.h stage/
          ls -la stage/
          tar czf tdlib-ohos-aarch64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-ohos-aarch64
          path: tdlib-ohos-aarch64.tar.gz
