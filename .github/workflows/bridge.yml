name: Build bridge NAPI for OHOS aarch64

on:
  workflow_dispatch:
  push:
    paths: [ 'bridge/**', '.github/workflows/bridge.yml' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download OHOS SDK
        run: |
          wget -q --tries=3 "https://repo.huaweicloud.com/openharmony/os/5.0.2-Release/ohos-sdk-windows_linux-public.tar.gz" -O /tmp/sdk.tar.gz
          mkdir -p /opt/sdk && tar xzf /tmp/sdk.tar.gz -C /opt/sdk
          LINUX_ZIP=$(find /opt/sdk -name "*native*linux*.zip" -o -name "*linux*native*.zip" | head -1)
          unzip -q "$LINUX_ZIP" -d /opt/nat
          LLVM_DIR=$(find /opt/nat -maxdepth 4 -type d -name llvm | head -1)
          echo "NATIVE=$(dirname $LLVM_DIR)" >> $GITHUB_ENV
          test -x "$(dirname $LLVM_DIR)/llvm/bin/aarch64-unknown-linux-ohos-clang"

      - name: Build libbridge.so
        run: |
          NATIVE=$NATIVE
          CC=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang
          CXX=$NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang++
          CPP=bridge/src/main/cpp
          # NAPI 头文件来自 SDK sysroot (napi 目录在 native sysroot 中)
          SYSROOT=$NATIVE/sysroot
          mkdir -p out
          $CXX --target=aarch64-linux-ohos --sysroot=$SYSROOT \
            -I$CPP -I$CPP/include -I$SYSROOT/usr/include \
            -std=c++17 -fPIC -O2 -shared \
            $CPP/napi_init.cpp $CPP/td_bridge.cpp \
            -L$CPP/prebuilt/arm64-v8a -ltdjson \
            -lace_napi.z -lhilog_ndk.z \
            -o out/libbridge.so
          ls -la out/

      - name: Verify symbols
        run: |
          NATIVE=$NATIVE
          $NATIVE/llvm/bin/llvm-nm -D out/libbridge.so | grep -E "createClientId|td_send|td_receive" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: libbridge-ohos-aarch64
          path: out/libbridge.so
